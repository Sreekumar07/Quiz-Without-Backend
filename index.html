<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aptitude Quiz</title>
    <style>
        :root {
            --bg: #f0f4f8;
            --surface: #ffffff;
            --surface-glass: rgba(255, 255, 255, 0.75);
            --text: #1a1a2e;
            --text-secondary: #555;
            --border: #e0e5ec;
            --accent: #4f6ef7;
            --accent-hover: #3b54d4;
            --accent-light: #eef1fd;
            --success: #22c55e;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.12);
            --radius-sm: 8px;
            --radius: 14px;
            --radius-lg: 20px;
            --radius-xl: 24px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --glass-blur: 16px;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
            --palette-gray: #d1d5db;
            --palette-yellow: #fcd34d;
            --palette-green: #86efac;
            --palette-current-ring: #4f6ef7;
        }

        [data-theme="dark"] {
            --bg: #0f1119;
            --surface: #1a1d2b;
            --surface-glass: rgba(26, 29, 43, 0.8);
            --text: #e2e4f0;
            --text-secondary: #a0a5bb;
            --border: #2a2d3d;
            --accent: #6c8cff;
            --accent-hover: #8ba3ff;
            --accent-light: #1e2440;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.35);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.45);
            --palette-gray: #3a3d50;
            --palette-yellow: #b8860b;
            --palette-green: #1a5c2a;
            --palette-current-ring: #6c8cff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 16px; scroll-behavior: smooth; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background var(--transition), color var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
        }
        input, textarea, .allow-select {
            user-select: text;
            -webkit-user-select: text;
            -ms-user-select: text;
        }

        .container { width: 100%; max-width: 960px; margin: 0 auto; }

        .card {
            background: var(--surface-glass);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            padding: 32px;
            transition: all var(--transition);
            animation: fadeSlideIn 0.4s ease-out;
        }
        @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0%,100%{ opacity: 1; } 50% { opacity: 0.5; } }
        @keyframes shake { 0%,100%{ transform: translateX(0); } 20%{ transform: translateX(-6px); } 40%{ transform: translateX(6px); } 60%{ transform: translateX(-4px); } 80%{ transform: translateX(4px); } }
        .shake { animation: shake 0.5s ease-out; }

        h1 { font-size: clamp(1.5rem, 3vw, 2.2rem); font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px; line-height: 1.2; }
        h2 { font-size: clamp(1.2rem, 2.5vw, 1.6rem); font-weight: 600; margin-bottom: 12px; }
        h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 8px; }
        p { line-height: 1.6; color: var(--text-secondary); margin-bottom: 8px; }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 12px 24px; border-radius: var(--radius); font-size: 0.95rem;
            font-weight: 600; cursor: pointer; border: none; transition: all var(--transition);
            font-family: var(--font); letter-spacing: 0.01em; position: relative; overflow: hidden; min-width: 100px;
        }
        .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
        .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 4px 14px rgba(79,110,247,0.35); }
        .btn-primary:hover { background: var(--accent-hover); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(79,110,247,0.45); }
        .btn-primary:active { transform: translateY(0); }
        .btn-secondary { background: var(--surface); color: var(--text); border: 2px solid var(--border); }
        .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
        .btn-outline { background: transparent; color: var(--accent); border: 2px solid var(--accent); }
        .btn-outline:hover { background: var(--accent); color: #fff; }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-danger:hover { background: #dc2626; transform: translateY(-2px); }
        .btn-sm { padding: 8px 14px; font-size: 0.85rem; border-radius: var(--radius-sm); min-width: auto; }
        .btn-lg { padding: 16px 36px; font-size: 1.1rem; border-radius: var(--radius); }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; pointer-events: none; filter: grayscale(30%); }

        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; color: var(--text); }
        .input-group input {
            width: 100%; padding: 12px 16px; border-radius: var(--radius); border: 2px solid var(--border);
            background: var(--surface); color: var(--text); font-size: 1rem; font-family: var(--font); transition: all var(--transition);
        }
        .input-group input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 4px rgba(79,110,247,0.1); }

        .theme-toggle {
            position: fixed; top: 16px; right: 16px; z-index: 1000; width: 44px; height: 44px;
            border-radius: 50%; background: var(--surface-glass); backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--border); cursor: pointer; font-size: 1.3rem; display: flex;
            align-items: center; justify-content: center; transition: all var(--transition); box-shadow: var(--shadow-md); color: var(--text);
        }
        .theme-toggle:hover { transform: scale(1.1); box-shadow: var(--shadow-lg); }
        .theme-toggle:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

        .quiz-header {
            display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border);
        }
        .timer-display {
            font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; font-family: var(--font-mono);
            color: var(--accent); background: var(--accent-light); padding: 8px 16px; border-radius: var(--radius-sm);
            min-width: 90px; text-align: center;
        }
        .timer-display.warning { color: var(--danger); background: #fef2f2; animation: pulse 1s infinite; }
        [data-theme="dark"] .timer-display.warning { background: #2d1a1a; }

        .progress-wrap { flex: 1; min-width: 200px; }
        .progress-bar-outer { height: 10px; background: var(--border); border-radius: 10px; overflow: hidden; }
        .progress-bar-inner { height: 100%; background: linear-gradient(90deg, var(--accent), #818cf8); border-radius: 10px; transition: width 0.4s ease; }
        .progress-stats { display: flex; gap: 12px; font-size: 0.8rem; margin-top: 6px; color: var(--text-secondary); flex-wrap: wrap; }
        .progress-stats span { display: inline-flex; align-items: center; gap: 4px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .dot.green { background: var(--palette-green); }
        .dot.yellow { background: var(--palette-yellow); }
        .dot.gray { background: var(--palette-gray); }

        .question-area { min-height: 250px; margin-bottom: 20px; }
        .question-number { font-size: 0.85rem; color: var(--accent); font-weight: 600; margin-bottom: 8px; }
        .question-text { font-size: 1.15rem; font-weight: 500; margin-bottom: 20px; line-height: 1.7; color: var(--text); }
        .question-text img { max-width: 100%; border-radius: var(--radius); margin: 12px 0; }
        .question-text table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 0.9rem; }
        .question-text table th, .question-text table td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; }
        .question-text table th { background: var(--accent-light); font-weight: 600; }
        .question-text pre { background: #1e1e2e; color: #e2e4f0; padding: 14px 18px; border-radius: var(--radius-sm); overflow-x: auto; font-family: var(--font-mono); font-size: 0.85rem; margin: 12px 0; }
        .question-text code { background: var(--accent-light); padding: 2px 7px; border-radius: 4px; font-family: var(--font-mono); font-size: 0.9em; }
        .question-text pre code { background: none; padding: 0; border-radius: 0; }

        .options-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
        .option-item {
            display: flex; align-items: center; gap: 12px; padding: 14px 18px; border: 2px solid var(--border);
            border-radius: var(--radius); cursor: pointer; transition: all var(--transition); background: var(--surface);
            font-size: 1rem; position: relative;
        }
        .option-item:hover { border-color: var(--accent); background: var(--accent-light); transform: translateX(3px); }
        .option-item.selected { border-color: var(--accent); background: var(--accent-light); box-shadow: 0 0 0 4px rgba(79,110,247,0.08); }
        .option-item.correct-reveal { border-color: var(--success) !important; background: #f0fdf4 !important; }
        [data-theme="dark"] .option-item.correct-reveal { background: #0d2818 !important; }
        .option-item.wrong-reveal { border-color: var(--danger) !important; background: #fef2f2 !important; }
        [data-theme="dark"] .option-item.wrong-reveal { background: #2d1a1a !important; }
        .option-letter {
            width: 36px; height: 36px; border-radius: 50%; background: var(--border); display: flex;
            align-items: center; justify-content: center; font-weight: 700; font-size: 0.9rem; flex-shrink: 0; transition: all var(--transition);
        }
        .option-item.selected .option-letter { background: var(--accent); color: #fff; }
        .option-item.correct-reveal .option-letter { background: var(--success); color: #fff; }
        .option-item.wrong-reveal .option-letter { background: var(--danger); color: #fff; }

        .nav-buttons { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 20px; }

        .palette-section { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
        .palette-title { font-weight: 600; margin-bottom: 10px; font-size: 0.9rem; color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .palette-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(38px, 1fr)); gap: 6px; max-height: 300px; overflow-y: auto; padding: 4px; }
        .palette-btn {
            width: 100%; aspect-ratio: 1; min-width: 34px; min-height: 34px; border-radius: var(--radius-sm);
            border: 2px solid transparent; cursor: pointer; font-weight: 600; font-size: 0.8rem; transition: all 0.15s ease;
            display: flex; align-items: center; justify-content: center; background: var(--palette-gray); color: #555; font-family: var(--font);
        }
        [data-theme="dark"] .palette-btn { color: #ccc; }
        .palette-btn.visited { background: var(--palette-yellow); color: #5c3d00; }
        .palette-btn.answered { background: var(--palette-green); color: #0d3b1a; }
        .palette-btn.current { border-color: var(--palette-current-ring); box-shadow: 0 0 0 3px rgba(79,110,247,0.3); transform: scale(1.1); z-index: 2; position: relative; }
        .palette-btn:hover { transform: scale(1.08); z-index: 1; }
        .palette-btn.current:hover { transform: scale(1.12); }
        .palette-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .result-card { text-align: center; }
        .result-score { font-size: 4rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1; margin: 16px 0; }
        .result-score.pass { color: var(--success); }
        .result-score.fail { color: var(--danger); }
        .result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 20px 0; text-align: center; }
        .result-item { background: var(--surface); border-radius: var(--radius); padding: 16px; border: 1px solid var(--border); }
        .result-item .value { font-size: 1.8rem; font-weight: 700; }
        .result-item .label { font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px; }

        .alert { padding: 14px 18px; border-radius: var(--radius); margin: 16px 0; font-weight: 500; border-left: 4px solid; }
        .alert-info { background: #eff6ff; border-color: var(--info); color: #1e40af; }
        .alert-warning { background: #fffbeb; border-color: var(--warning); color: #92400e; }
        .alert-error { background: #fef2f2; border-color: var(--danger); color: #991b1b; }
        [data-theme="dark"] .alert-info { background: #1a2740; color: #93c5fd; }
        [data-theme="dark"] .alert-warning { background: #2d2410; color: #fcd34d; }
        [data-theme="dark"] .alert-error { background: #2d1a1a; color: #fca5a5; }

        .review-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        .review-table th, .review-table td { padding: 8px 12px; border: 1px solid var(--border); text-align: center; }
        .review-table th { background: var(--accent-light); font-weight: 600; }
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
        .status-badge.correct { background: #dcfce7; color: #166534; }
        .status-badge.wrong { background: #fee2e2; color: #991b1b; }
        .status-badge.skipped { background: #fef3c7; color: #92400e; }
        [data-theme="dark"] .status-badge.correct { background: #0d2818; color: #86efac; }
        [data-theme="dark"] .status-badge.wrong { background: #2d1a1a; color: #fca5a5; }
        [data-theme="dark"] .status-badge.skipped { background: #2d2410; color: #fcd34d; }

        .text-center { text-align: center; }
        .mt-16 { margin-top: 16px; }
        .mt-20 { margin-top: 20px; }
        .mb-16 { margin-bottom: 16px; }
        .hidden { display: none !important; }
        .flex-center { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }

        .spinner { width: 44px; height: 44px; border: 4px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 40px auto; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .card { padding: 20px 16px; border-radius: var(--radius); }
            .quiz-header { flex-direction: column; align-items: stretch; gap: 10px; }
            .timer-display { text-align: center; font-size: 1.2rem; }
            .nav-buttons { gap: 6px; }
            .btn { padding: 10px 16px; font-size: 0.85rem; }
            .palette-grid { grid-template-columns: repeat(auto-fill, minmax(32px, 1fr)); gap: 4px; max-height: 200px; }
            .palette-btn { min-width: 28px; min-height: 28px; font-size: 0.7rem; }
            .result-score { font-size: 2.8rem; }
            .result-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
        }
        @media (max-width: 400px) {
            .card { padding: 14px 10px; }
            .btn { padding: 8px 12px; font-size: 0.8rem; }
            .palette-grid { grid-template-columns: repeat(auto-fill, minmax(28px, 1fr)); }
            .nav-buttons { flex-direction: column; }
            .nav-buttons .btn { width: 100%; }
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #aaa; }
    </style>
</head>
<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" title="Toggle dark/light mode">
        <span class="theme-icon"></span>
    </button>

    <div class="container" id="appContainer"></div>

    <script>
        (function() {
            const QUIZ_DATA_URL = './data/quiz.json';
            const STORAGE_PREFIX = 'quizplatform_';
            const KEYS = {
                currentQuizId: STORAGE_PREFIX + 'currentQuizId',
                studentDetails: STORAGE_PREFIX + 'studentDetails',
                getAnswersKey: (quizId) => STORAGE_PREFIX + 'answers_' + quizId,
                getTimerStartKey: (quizId) => STORAGE_PREFIX + 'timerStart_' + quizId,
                getTimerEndKey: (quizId) => STORAGE_PREFIX + 'timerEnd_' + quizId,
                getCompletedKey: (quizId) => STORAGE_PREFIX + 'completed_' + quizId,
                getResultKey: (quizId) => STORAGE_PREFIX + 'result_' + quizId,
                getTabSwitchesKey: (quizId) => STORAGE_PREFIX + 'tabSwitches_' + quizId,
                getQuestionOrderKey: (quizId) => STORAGE_PREFIX + 'qOrder_' + quizId,
                getCurrentIndexKey: (quizId) => STORAGE_PREFIX + 'currentIndex_' + quizId,
                getVisitedKey: (quizId) => STORAGE_PREFIX + 'visited_' + quizId,
            };

            const appContainer = document.getElementById('appContainer');
            const themeToggle = document.getElementById('themeToggle');

            let quizData = null;
            let currentQuizId = null;
            let studentDetails = null;
            let answers = {};
            let visitedQuestions = new Set();
            let currentQuestionIndex = 0;
            let questionOrder = [];
            let timerStart = null;
            let timerEnd = null;
            let timerInterval = null;
            let tabSwitchCount = 0;
            let quizCompleted = false;
            let savedResult = null;

            function $(selector, parent = document) { return parent.querySelector(selector); }
            function $$(selector, parent = document) { return parent.querySelectorAll(selector); }

            function safeGetItem(key) { try { const val = localStorage.getItem(key); return val ? JSON.parse(val) : null; } catch (e) { return null; } }
            function safeSetItem(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { console.warn('localStorage write failed:', e); } }
            function safeRemoveItem(key) { try { localStorage.removeItem(key); } catch (e) {} }

            function clearAllQuizData(quizId) {
                safeRemoveItem(KEYS.getAnswersKey(quizId));
                safeRemoveItem(KEYS.getTimerStartKey(quizId));
                safeRemoveItem(KEYS.getTimerEndKey(quizId));
                safeRemoveItem(KEYS.getCompletedKey(quizId));
                safeRemoveItem(KEYS.getResultKey(quizId));
                safeRemoveItem(KEYS.getTabSwitchesKey(quizId));
                safeRemoveItem(KEYS.getQuestionOrderKey(quizId));
                safeRemoveItem(KEYS.getCurrentIndexKey(quizId));
                safeRemoveItem(KEYS.getVisitedKey(quizId));
            }

            function shuffleArray(arr) {
                const a = [...arr];
                for (let i = a.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [a[i], a[j]] = [a[j], a[i]];
                }
                return a;
            }

            function formatTime(ms) {
                if (ms <= 0) return '00:00';
                const totalSec = Math.floor(ms / 1000);
                const mins = Math.floor(totalSec / 60);
                const secs = totalSec % 60;
                return String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
            }

            function formatDateTime(isoStr) {
                try { return new Date(isoStr).toLocaleString(); } catch (e) { return isoStr; }
            }

            function parseMarkdown(text) {
                if (!text) return '';
                let html = text;
                const codeBlocks = [];
                html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (match, lang, code) => {
                    const idx = codeBlocks.length;
                    codeBlocks.push(`<pre><code class="language-${lang || 'plaintext'}">${escapeHtml(code.trim())}</code></pre>`);
                    return `%%CODEBLOCK_${idx}%%`;
                });
                const inlineCodes = [];
                html = html.replace(/`([^`]+)`/g, (match, code) => {
                    const idx = inlineCodes.length;
                    inlineCodes.push(`<code>${escapeHtml(code)}</code>`);
                    return `%%INLINECODE_${idx}%%`;
                });
                html = escapeHtml(html);
                html = html.replace(/%%INLINECODE_(\d+)%%/g, (_, i) => inlineCodes[parseInt(i)]);
                html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
                html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
                html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
                html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
                html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
                html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
                html = html.replace(/___(.+?)___/g, '<strong><em>$1</em></strong>');
                html = html.replace(/__(.+?)__/g, '<strong>$1</strong>');
                html = html.replace(/_(.+?)_/g, '<em>$1</em>');
                html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" loading="lazy" style="max-width:100%;border-radius:var(--radius);margin:12px 0;">');
                html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
                html = html.replace(/^---$/gm, '<hr>');
                html = html.replace(/(\|[^\n]+\|\n\|[-| :]+\|\n(?:\|[^\n]+\|\n?)*)/g, (match) => {
                    const lines = match.trim().split('\n');
                    if (lines.length < 2) return match;
                    let tableHtml = '<table>';
                    const headerCells = lines[0].split('|').filter(c => c.trim() !== '');
                    tableHtml += '<thead><tr>' + headerCells.map(c => `<th>${c.trim()}</th>`).join('') + '</tr></thead>';
                    tableHtml += '<tbody>';
                    for (let i = 2; i < lines.length; i++) {
                        const cells = lines[i].split('|').filter(c => c.trim() !== '');
                        tableHtml += '<tr>' + cells.map(c => `<td>${c.trim()}</td>`).join('') + '</tr>';
                    }
                    tableHtml += '</tbody></table>';
                    return tableHtml;
                });
                html = html.replace(/^[\*\-] (.+)$/gm, '<li>$1</li>');
                html = html.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
                html = html.replace(/\n\n/g, '</p><p>');
                html = html.replace(/\n/g, '<br>');
                if (!html.startsWith('<')) html = '<p>' + html + '</p>';
                html = html.replace(/<p>\s*<\/p>/g, '');
                html = html.replace(/%%CODEBLOCK_(\d+)%%/g, (_, i) => codeBlocks[parseInt(i)]);
                return html;
            }

            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function getPreferredTheme() {
                const saved = localStorage.getItem(STORAGE_PREFIX + 'theme');
                if (saved === 'dark' || saved === 'light') return saved;
                if (window.matchMedia('(prefers-color-scheme: dark)').matches) return 'dark';
                return 'light';
            }

            function applyTheme(theme) {
                document.documentElement.setAttribute('data-theme', theme);
                const moonSVG = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
                const sunSVG  = `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>`;
                themeToggle.innerHTML = theme === 'dark' ? sunSVG : moonSVG;
                localStorage.setItem(STORAGE_PREFIX + 'theme', theme);
            }

            function toggleTheme() {
                const current = document.documentElement.getAttribute('data-theme');
                applyTheme(current === 'dark' ? 'light' : 'dark');
            }

            themeToggle.addEventListener('click', toggleTheme);
            applyTheme(getPreferredTheme());

            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
                if (!localStorage.getItem(STORAGE_PREFIX + 'theme')) {
                    applyTheme(e.matches ? 'dark' : 'light');
                }
            });

            document.addEventListener('visibilitychange', () => {
                if (document.hidden && currentQuizId && !quizCompleted && timerEnd && Date.now() < timerEnd) {
                    tabSwitchCount++;
                    safeSetItem(KEYS.getTabSwitchesKey(currentQuizId), tabSwitchCount);
                }
            });

            document.addEventListener('contextmenu', (e) => {
                if (e.target.closest('.card') && !e.target.closest('input') && !e.target.closest('textarea')) {
                    e.preventDefault();
                }
            });

            function saveAnswers() { if (currentQuizId) safeSetItem(KEYS.getAnswersKey(currentQuizId), answers); }
            function loadAnswers() { return currentQuizId ? (safeGetItem(KEYS.getAnswersKey(currentQuizId)) || {}) : {}; }
            function saveVisited() { if (currentQuizId) safeSetItem(KEYS.getVisitedKey(currentQuizId), [...visitedQuestions]); }
            function loadVisited() { if (!currentQuizId) return new Set(); const arr = safeGetItem(KEYS.getVisitedKey(currentQuizId)); return arr ? new Set(arr) : new Set(); }
            function saveCurrentIndex() { if (currentQuizId) safeSetItem(KEYS.getCurrentIndexKey(currentQuizId), currentQuestionIndex); }
            function loadCurrentIndex() { return currentQuizId ? (safeGetItem(KEYS.getCurrentIndexKey(currentQuizId)) || 0) : 0; }
            function saveTimerInfo() { if (currentQuizId) { if (timerStart) safeSetItem(KEYS.getTimerStartKey(currentQuizId), timerStart); if (timerEnd) safeSetItem(KEYS.getTimerEndKey(currentQuizId), timerEnd); } }
            function loadTimerInfo() { if (!currentQuizId) return { start: null, end: null }; return { start: safeGetItem(KEYS.getTimerStartKey(currentQuizId)), end: safeGetItem(KEYS.getTimerEndKey(currentQuizId)) }; }

            function getTotalQuestions() { return quizData ? quizData.questions.length : 0; }
            function getOrderedQuestionId(index) { return (questionOrder.length > 0 && index < questionOrder.length) ? questionOrder[index] : index; }
            function getQuestionById(qId) { return quizData.questions.find(q => q.id === qId) || null; }
            function getCurrentQuestion() { const qId = getOrderedQuestionId(currentQuestionIndex); return getQuestionById(qId); }
            function getSelectedOption(qId) { return answers.hasOwnProperty(qId) ? answers[qId] : null; }
            function isQuestionAnswered(qId) { return answers.hasOwnProperty(qId) && answers[qId] !== null; }
            function getAnsweredCount() { return Object.keys(answers).filter(k => answers[k] !== null).length; }
            function getRemainingTime() { return timerEnd ? Math.max(0, timerEnd - Date.now()) : 0; }
            function isTimeUp() { return timerEnd && Date.now() >= timerEnd; }

            function initQuizState() {
                if (!quizData) return;
                currentQuizId = quizData.quizId;
                const storedQuizId = safeGetItem(KEYS.currentQuizId);

                if (storedQuizId !== currentQuizId) {
                    if (storedQuizId) clearAllQuizData(storedQuizId);
                    answers = {};
                    visitedQuestions = new Set();
                    currentQuestionIndex = 0;
                    questionOrder = [];
                    timerStart = null;
                    timerEnd = null;
                    tabSwitchCount = 0;
                    quizCompleted = false;
                    savedResult = null;
                    safeSetItem(KEYS.currentQuizId, currentQuizId);

                    if (quizData.shuffleQuestions) {
                        questionOrder = shuffleArray(quizData.questions.map(q => q.id));
                    } else {
                        questionOrder = quizData.questions.map(q => q.id);
                    }

                    safeSetItem(KEYS.getQuestionOrderKey(currentQuizId), questionOrder);
                    safeSetItem(KEYS.getTabSwitchesKey(currentQuizId), 0);
                    safeSetItem(KEYS.getAnswersKey(currentQuizId), {});
                    safeSetItem(KEYS.getVisitedKey(currentQuizId), []);
                    safeSetItem(KEYS.getCurrentIndexKey(currentQuizId), 0);
                } else {
                    questionOrder = safeGetItem(KEYS.getQuestionOrderKey(currentQuizId)) || quizData.questions.map(q => q.id);
                    answers = loadAnswers();
                    visitedQuestions = loadVisited();
                    currentQuestionIndex = loadCurrentIndex();
                    tabSwitchCount = safeGetItem(KEYS.getTabSwitchesKey(currentQuizId)) || 0;
                    const timerInfo = loadTimerInfo();
                    timerStart = timerInfo.start;
                    timerEnd = timerInfo.end;
                    quizCompleted = safeGetItem(KEYS.getCompletedKey(currentQuizId)) || false;
                    savedResult = safeGetItem(KEYS.getResultKey(currentQuizId));
                }
                studentDetails = safeGetItem(KEYS.studentDetails);
            }

            function renderLoading() {
                appContainer.innerHTML = `<div class="card text-center"><div class="spinner"></div><p>Loading quiz data...</p></div>`;
            }

            function renderError(title, message) {
                appContainer.innerHTML = `<div class="card text-center"><h2>${escapeHtml(title)}</h2><div class="alert alert-error">${escapeHtml(message)}</div><button class="btn btn-primary mt-16" onclick="location.reload()">Retry</button></div>`;
            }

            function renderStudentForm() {
                appContainer.innerHTML = `
                <div class="card">
                    <h2>Student Details</h2>
                    <p>Please enter your details to begin the quiz.</p>
                    <form id="studentForm">
                        <div class="input-group"><label for="fullName">Full Name *</label><input type="text" id="fullName" placeholder="Enter your full name" required autocomplete="name"></div>
                        <div class="input-group"><label for="regNumber">Registration Number *</label><input type="text" id="regNumber" placeholder="Enter your registration number" required autocomplete="off"></div>
                        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">Continue</button>
                    </form>
                </div>`;
                document.getElementById('studentForm').addEventListener('submit', handleStudentSubmit);
            }

            function handleStudentSubmit(e) {
                e.preventDefault();
                const fullName = document.getElementById('fullName').value.trim();
                const regNumber = document.getElementById('regNumber').value.trim();
                if (!fullName || !regNumber) {
                    const card = appContainer.querySelector('.card');
                    card.classList.add('shake');
                    setTimeout(() => card.classList.remove('shake'), 500);
                    return;
                }
                studentDetails = { fullName, regNumber };
                safeSetItem(KEYS.studentDetails, studentDetails);
                renderInstructions();
            }

            function renderInstructions() {
                const totalQ = getTotalQuestions();
                const durationMin = quizData.duration;
                const passing = quizData.passingMarks;
                const negMark = quizData.negativeMarking;
                const shuffleQ = quizData.shuffleQuestions;

                appContainer.innerHTML = `
                <div class="card">
                    <h1>${escapeHtml(quizData.title)}</h1>
                    <p>${escapeHtml(quizData.description || '')}</p>
                    <div class="result-grid mt-20">
                        <div class="result-item"><div class="value">${totalQ}</div><div class="label">Questions</div></div>
                        <div class="result-item"><div class="value">${durationMin} min</div><div class="label">Duration</div></div>
                        <div class="result-item"><div class="value">${passing}%</div><div class="label">Passing Marks</div></div>
                        <div class="result-item"><div class="value">${negMark > 0 ? 'Yes (-' + negMark + ')' : 'No'}</div><div class="label">Negative Marking</div></div>
                    </div>
                    <div class="alert alert-info mt-16">
                        <strong>Instructions:</strong>
                        <ul style="margin:8px 0 0 18px;line-height:1.8;">
                            <li>Total questions: <strong>${totalQ}</strong></li>
                            <li>Duration: <strong>${durationMin} minutes</strong></li>
                            <li>Passing marks: <strong>${passing}%</strong></li>
                            ${negMark > 0 ? `<li>Negative marking: <strong>-${negMark} per wrong answer</strong></li>` : ''}
                            ${shuffleQ ? '<li>Questions will be <strong>shuffled</strong></li>' : ''}
                            <li>Do not refresh or close the browser during the quiz</li>
                            <li>The timer continues even if you close the browser</li>
                            <li>Tab switches are monitored</li>
                        </ul>
                    </div>
                    <div class="text-center mt-20">
                        <button class="btn btn-primary btn-lg" id="startQuizBtn">START QUIZ</button>
                    </div>
                </div>`;
                document.getElementById('startQuizBtn').addEventListener('click', startQuiz);
            }

            function startQuiz() {
                if (!timerStart || !timerEnd) {
                    timerStart = Date.now();
                    timerEnd = timerStart + (quizData.duration * 60 * 1000);
                    saveTimerInfo();
                }
                quizCompleted = false;
                safeSetItem(KEYS.getCompletedKey(currentQuizId), false);
                safeRemoveItem(KEYS.getResultKey(currentQuizId));
                savedResult = null;
                currentQuestionIndex = loadCurrentIndex();
                visitedQuestions.add(currentQuestionIndex);
                saveVisited();
                saveCurrentIndex();
                startTimerInterval();
                renderQuizPage();
            }

            function startTimerInterval() {
                stopTimerInterval();
                updateTimerDisplay();
                timerInterval = setInterval(() => {
                    updateTimerDisplay();
                    if (isTimeUp()) {
                        stopTimerInterval();
                        autoSubmit();
                    }
                }, 500);
            }

            function stopTimerInterval() {
                if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
            }

            function updateTimerDisplay() {
                const timerEl = document.getElementById('timerDisplay');
                if (!timerEl) return;
                const remaining = getRemainingTime();
                timerEl.textContent = formatTime(remaining);
                timerEl.classList.toggle('warning', remaining < 60000);
            }

            function renderQuizPage() {
                const totalQ = getTotalQuestions();
                const answeredCount = getAnsweredCount();
                const percent = totalQ > 0 ? Math.round((answeredCount / totalQ) * 100) : 0;
                const remaining = getRemainingTime();
                const question = getCurrentQuestion();
                const qId = question ? question.id : null;
                const selectedOption = qId ? getSelectedOption(qId) : null;

                let optionsHtml = '';
                if (question && question.options && question.options.length === 4) {
                    const letters = ['A', 'B', 'C', 'D'];
                    // No option shuffling – use original order
                    optionsHtml = question.options.map((opt, idx) => {
                        const isSelected = selectedOption === idx;
                        return `<li class="option-item${isSelected ? ' selected' : ''}" data-option-index="${idx}" role="radio" aria-checked="${isSelected}" tabindex="0" aria-label="Option ${letters[idx]}: ${escapeHtml(opt)}"><span class="option-letter">${letters[idx]}</span><span>${escapeHtml(opt)}</span></li>`;
                    }).join('');
                }

                const paletteHtml = generatePaletteHtml();
                appContainer.innerHTML = `
                <div class="card" id="quizCard">
                    <div class="quiz-header">
                        <div class="timer-display" id="timerDisplay">${formatTime(remaining)}</div>
                        <div class="progress-wrap">
                            <div class="progress-bar-outer"><div class="progress-bar-inner" style="width:${percent}%;"></div></div>
                            <div class="progress-stats">
                                <span><span class="dot green"></span> Answered: ${answeredCount}</span>
                                <span><span class="dot gray"></span> Remaining: ${totalQ - answeredCount}</span>
                                <span>${percent}% done</span>
                            </div>
                        </div>
                    </div>
                    <div class="question-area">
                        <div class="question-number">Question ${currentQuestionIndex + 1} of ${totalQ}</div>
                        <div class="question-text allow-select">${parseMarkdown(question ? question.question : '')}</div>
                        ${question && question.image ? `<img src="${escapeHtml(question.image)}" alt="Question image" style="max-width:100%;border-radius:var(--radius);margin-bottom:16px;" loading="lazy" onerror="this.style.display='none';">` : ''}
                        <ul class="options-list" id="optionsList">${optionsHtml}</ul>
                    </div>
                    <div class="nav-buttons">
                        <button class="btn btn-secondary" id="prevBtn" ${currentQuestionIndex === 0 ? 'disabled' : ''}>◀ Previous</button>
                        <button class="btn btn-outline" id="reviewBtn">Review</button>
                        <button class="btn btn-primary" id="nextBtn" ${currentQuestionIndex >= totalQ - 1 ? 'disabled' : ''}>Next ▶</button>
                        <button class="btn btn-danger" id="submitBtn">Submit Quiz</button>
                    </div>
                    <div class="palette-section">
                        <div class="palette-title" id="paletteToggle">Question Palette <span style="font-size:0.7rem;">(click to expand)</span></div>
                        <div class="palette-grid" id="paletteGrid">${paletteHtml}</div>
                    </div>
                </div>`;

                updateTimerDisplay();
                bindQuizEvents(question, qId);
                const currentPaletteBtn = document.getElementById('paletteBtn-' + currentQuestionIndex);
                if (currentPaletteBtn) currentPaletteBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }

            function generatePaletteHtml() {
                const totalQ = getTotalQuestions();
                let html = '';
                for (let i = 0; i < totalQ; i++) {
                    const qId = getOrderedQuestionId(i);
                    let cls = '';
                    if (i === currentQuestionIndex) cls += ' current';
                    if (isQuestionAnswered(qId)) cls += ' answered';
                    else if (visitedQuestions.has(i)) cls += ' visited';
                    html += `<button class="palette-btn${cls}" id="paletteBtn-${i}" data-index="${i}" aria-label="Go to question ${i + 1}">${i + 1}</button>`;
                }
                return html;
            }

            function bindQuizEvents(question, qId) {
                const optionItems = $$('.option-item', appContainer);
                optionItems.forEach(item => {
                    item.addEventListener('click', function() {
                        const optIndex = parseInt(this.getAttribute('data-option-index'));
                        selectOption(qId, optIndex);
                    });
                    item.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            const optIndex = parseInt(this.getAttribute('data-option-index'));
                            selectOption(qId, optIndex);
                        }
                    });
                });

                document.getElementById('prevBtn').addEventListener('click', () => navigateQuestion(-1));
                document.getElementById('nextBtn').addEventListener('click', () => navigateQuestion(1));
                document.getElementById('reviewBtn').addEventListener('click', showReviewModal);
                document.getElementById('submitBtn').addEventListener('click', () => showReviewModal(true));

                const paletteBtns = $$('.palette-btn', appContainer);
                paletteBtns.forEach(btn => {
                    btn.addEventListener('click', function() {
                        const idx = parseInt(this.getAttribute('data-index'));
                        jumpToQuestion(idx);
                    });
                });

                const paletteGrid = document.getElementById('paletteGrid');
                const paletteToggle = document.getElementById('paletteToggle');
                let paletteOpen = true;
                paletteToggle.addEventListener('click', () => {
                    paletteOpen = !paletteOpen;
                    paletteGrid.style.display = paletteOpen ? 'grid' : 'none';
                    paletteToggle.innerHTML = paletteOpen ? 'Question Palette <span style="font-size:0.7rem;">(click to collapse)</span>' : 'Question Palette <span style="font-size:0.7rem;">(click to expand)</span>';
                });

                document.addEventListener('keydown', handleQuizKeyboard);
            }

            function handleQuizKeyboard(e) {
                if (!currentQuizId || quizCompleted) return;
                if (e.target.closest('input') || e.target.closest('textarea')) return;
                const totalQ = getTotalQuestions();
                switch (e.key) {
                    case 'ArrowLeft': e.preventDefault(); if (currentQuestionIndex > 0) navigateQuestion(-1); break;
                    case 'ArrowRight': e.preventDefault(); if (currentQuestionIndex < totalQ - 1) navigateQuestion(1); break;
                    case '1': case 'a': case 'A': e.preventDefault(); selectOptionByLetter(0); break;
                    case '2': case 'b': case 'B': e.preventDefault(); selectOptionByLetter(1); break;
                    case '3': case 'c': case 'C': e.preventDefault(); selectOptionByLetter(2); break;
                    case '4': case 'd': case 'D': e.preventDefault(); selectOptionByLetter(3); break;
                }
            }

            function selectOptionByLetter(letterIndex) {
                const question = getCurrentQuestion();
                if (!question) return;
                const qId = question.id;
                if (letterIndex < 4) selectOption(qId, letterIndex);
            }

            function selectOption(qId, optIndex) {
                answers[qId] = optIndex;
                saveAnswers();
                visitedQuestions.add(currentQuestionIndex);
                saveVisited();
                const optionsList = document.getElementById('optionsList');
                if (optionsList) {
                    $$('.option-item', optionsList).forEach(item => {
                        const itemIdx = parseInt(item.getAttribute('data-option-index'));
                        const isSelected = itemIdx === optIndex;
                        item.classList.toggle('selected', isSelected);
                        item.setAttribute('aria-checked', isSelected);
                    });
                }
                updatePaletteButton(currentQuestionIndex);
                updateProgressBar();
            }

            function updatePaletteButton(index) {
                const btn = document.getElementById('paletteBtn-' + index);
                if (!btn) return;
                const qId = getOrderedQuestionId(index);
                btn.classList.remove('visited', 'answered');
                if (isQuestionAnswered(qId)) btn.classList.add('answered');
                else if (visitedQuestions.has(index)) btn.classList.add('visited');
                if (index === currentQuestionIndex) btn.classList.add('current');
            }

            function updateProgressBar() {
                const totalQ = getTotalQuestions();
                const answeredCount = getAnsweredCount();
                const percent = totalQ > 0 ? Math.round((answeredCount / totalQ) * 100) : 0;
                const bar = document.querySelector('.progress-bar-inner');
                if (bar) bar.style.width = percent + '%';
                const stats = document.querySelector('.progress-stats');
                if (stats) stats.innerHTML = `<span><span class="dot green"></span> Answered: ${answeredCount}</span><span><span class="dot gray"></span> Remaining: ${totalQ - answeredCount}</span><span>${percent}% done</span>`;
            }

            function navigateQuestion(delta) {
                const totalQ = getTotalQuestions();
                const newIndex = currentQuestionIndex + delta;
                if (newIndex >= 0 && newIndex < totalQ) {
                    currentQuestionIndex = newIndex;
                    visitedQuestions.add(currentQuestionIndex);
                    saveVisited();
                    saveCurrentIndex();
                    renderQuizPage();
                }
            }

            function jumpToQuestion(index) {
                const totalQ = getTotalQuestions();
                if (index >= 0 && index < totalQ) {
                    currentQuestionIndex = index;
                    visitedQuestions.add(currentQuestionIndex);
                    saveVisited();
                    saveCurrentIndex();
                    renderQuizPage();
                }
            }

            function showReviewModal(confirmSubmit = false) {
                const totalQ = getTotalQuestions();
                const answeredCount = getAnsweredCount();
                const remaining = getRemainingTime();
                let tableRows = '';
                for (let i = 0; i < totalQ; i++) {
                    const qId = getOrderedQuestionId(i);
                    const isAns = isQuestionAnswered(qId);
                    tableRows += `<tr><td>${i + 1}</td><td><span class="status-badge ${isAns ? 'answered' : 'skipped'}">${isAns ? 'Answered' : 'Not Answered'}</span></td><td><button class="btn btn-sm btn-outline" data-jump="${i}">Go</button></td></tr>`;
                }

                appContainer.innerHTML = `
                <div class="card" id="reviewCard" style="max-height:80vh;overflow-y:auto;">
                    <h2>Quiz Review</h2>
                    <div class="result-grid">
                        <div class="result-item"><div class="value">${answeredCount}</div><div class="label">Answered</div></div>
                        <div class="result-item"><div class="value">${totalQ - answeredCount}</div><div class="label">Not Answered</div></div>
                        <div class="result-item"><div class="value">${totalQ}</div><div class="label">Total</div></div>
                        <div class="result-item"><div class="value">${formatTime(remaining)}</div><div class="label">Remaining</div></div>
                    </div>
                    <div style="max-height:300px;overflow-y:auto;margin:16px 0;">
                        <table class="review-table"><thead><tr><th>#</th><th>Status</th><th>Action</th></tr></thead><tbody>${tableRows}</tbody></table>
                    </div>
                    ${confirmSubmit ? '<div class="alert alert-warning">Are you sure you want to submit? This action cannot be undone.</div>' : ''}
                    <div class="flex-center mt-16">
                        ${confirmSubmit ? '<button class="btn btn-danger btn-lg" id="confirmSubmitBtn">Confirm Submit</button>' : '<button class="btn btn-primary" id="closeReviewBtn">Return to Quiz</button>'}
                        ${!confirmSubmit ? '<button class="btn btn-danger" id="submitFromReviewBtn">Submit Quiz</button>' : ''}
                        <button class="btn btn-secondary" id="cancelReviewBtn">Cancel</button>
                    </div>
                </div>`;

                $$('[data-jump]', appContainer).forEach(btn => {
                    btn.addEventListener('click', function() { jumpToQuestion(parseInt(this.getAttribute('data-jump'))); });
                });
                document.getElementById('cancelReviewBtn').addEventListener('click', () => { quizCompleted ? renderResultPage() : renderQuizPage(); });
                if (confirmSubmit) {
                    document.getElementById('confirmSubmitBtn').addEventListener('click', submitQuiz);
                } else {
                    document.getElementById('closeReviewBtn').addEventListener('click', () => renderQuizPage());
                    document.getElementById('submitFromReviewBtn').addEventListener('click', () => showReviewModal(true));
                }
            }

            function autoSubmit() { submitQuiz(true); }

            function submitQuiz(isAuto = false) {
                if (quizCompleted && savedResult) { renderResultPage(); return; }
                stopTimerInterval();
                const result = calculateResult();
                quizCompleted = true;
                savedResult = result;
                safeSetItem(KEYS.getCompletedKey(currentQuizId), true);
                safeSetItem(KEYS.getResultKey(currentQuizId), result);
                safeSetItem(KEYS.getTabSwitchesKey(currentQuizId), tabSwitchCount);
                renderResultPage();
            }

            function calculateResult() {
                const totalQ = getTotalQuestions();
                let correct = 0, wrong = 0, skipped = 0;
                const negMark = quizData.negativeMarking || 0;

                for (let i = 0; i < totalQ; i++) {
                    const qId = getOrderedQuestionId(i);
                    const selected = getSelectedOption(qId);
                    const question = getQuestionById(qId);
                    if (selected === null || selected === undefined) {
                        skipped++;
                    } else if (question && selected === question.correct) {
                        correct++;
                    } else {
                        wrong++;
                    }
                }

                const rawScore = correct - (wrong * negMark);
                const maxScore = totalQ;
                const percentage = maxScore > 0 ? Math.max(0, Math.round((rawScore / maxScore) * 100)) : 0;
                const passed = percentage >= (quizData.passingMarks || 40);
                const timeTaken = timerStart ? Date.now() - timerStart : 0;
                const completionTime = new Date().toISOString();

                return {
                    quizTitle: quizData.title,
                    quizId: currentQuizId,
                    studentName: studentDetails ? studentDetails.fullName : 'N/A',
                    regNumber: studentDetails ? studentDetails.regNumber : 'N/A',
                    score: rawScore,
                    maxScore: maxScore,
                    percentage: percentage,
                    correct: correct,
                    wrong: wrong,
                    skipped: skipped,
                    totalQuestions: totalQ,
                    timeTaken: timeTaken,
                    timeTakenFormatted: formatTime(timeTaken),
                    completionTime: completionTime,
                    tabSwitches: tabSwitchCount,
                    passed: passed,
                    passingMarks: quizData.passingMarks || 40,
                };
            }

            function renderResultPage() {
                if (!savedResult) { renderError('Error', 'No result data found.'); return; }
                const result = savedResult;
                const solutionPdfUrl = quizData.solutionPdfUrl || null;

                appContainer.innerHTML = `
                <div class="card result-card" id="resultCard">
                    <h1>Quiz Completed!</h1>
                    <h2>${escapeHtml(result.quizTitle)}</h2>
                    <p style="color:var(--text-secondary);">Quiz ID: ${escapeHtml(result.quizId)}</p>
                    <div class="result-score ${result.passed ? 'pass' : 'fail'}">${result.percentage}%</div>
                    <div class="alert ${result.passed ? 'alert-info' : 'alert-error'}">
                        <strong>${result.passed ? 'PASSED' : 'FAILED'}</strong> — Passing marks: ${result.passingMarks}%
                    </div>
                    <div class="result-grid">
                        <div class="result-item"><div class="value" style="color:var(--success);">${result.correct}</div><div class="label">Correct</div></div>
                        <div class="result-item"><div class="value" style="color:var(--danger);">${result.wrong}</div><div class="label">Wrong</div></div>
                        <div class="result-item"><div class="value" style="color:var(--warning);">${result.skipped}</div><div class="label">Skipped</div></div>
                        <div class="result-item"><div class="value">${result.score}/${result.maxScore}</div><div class="label">Score</div></div>
                    </div>
                    <div class="result-grid">
                        <div class="result-item"><div class="value">${result.timeTakenFormatted}</div><div class="label">Time Taken</div></div>
                        <div class="result-item"><div class="value">${result.tabSwitches}</div><div class="label">Tab Switches</div></div>
                        <div class="result-item"><div class="value">${escapeHtml(result.studentName)}</div><div class="label">Student</div></div>
                        <div class="result-item"><div class="value">${escapeHtml(result.regNumber)}</div><div class="label">Reg Number</div></div>
                    </div>
                    <p style="font-size:0.8rem;color:var(--text-secondary);">Completed: ${formatDateTime(result.completionTime)}</p>
                    <div class="flex-center mt-20">
                        <button class="btn btn-primary" id="reviewAnswersBtn">Review Answers</button>
                        ${solutionPdfUrl ? `<a href="${escapeHtml(solutionPdfUrl)}" target="_blank" class="btn btn-outline" download>Download Solution PDF</a>` : ''}
                    </div>
                </div>`;

                document.getElementById('reviewAnswersBtn').addEventListener('click', showDetailedReview);
            }

            function showDetailedReview() {
                const totalQ = getTotalQuestions();
                let rows = '';
                for (let i = 0; i < totalQ; i++) {
                    const qId = getOrderedQuestionId(i);
                    const question = getQuestionById(qId);
                    if (!question) continue;
                    const correctIdx = question.correct;
                    const correctOptionText = question.options[correctIdx];
                    const userSelected = getSelectedOption(qId);
                    let userAnswerText = 'Skipped';
                    let status = 'skipped';
                    if (userSelected !== null && userSelected !== undefined) {
                        userAnswerText = question.options[userSelected];
                        status = (userSelected === correctIdx) ? 'correct' : 'wrong';
                    }
                    rows += `
                    <tr>
                        <td>${i + 1}</td>
                        <td style="text-align:left;">${parseMarkdown(question.question)}</td>
                        <td>${escapeHtml(correctOptionText)}</td>
                        <td>${escapeHtml(userAnswerText)}</td>
                        <td><span class="status-badge ${status}">${status.charAt(0).toUpperCase() + status.slice(1)}</span></td>
                    </tr>`;
                }

                appContainer.innerHTML = `
                <div class="card" id="detailedReviewCard" style="max-height:85vh;overflow-y:auto;">
                    <h2>Answer Review</h2>
                    <div style="overflow-x:auto;">
                        <table class="review-table">
                            <thead><tr><th>#</th><th>Question</th><th>Correct Answer</th><th>Your Answer</th><th>Result</th></tr></thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>
                    <div class="text-center mt-20">
                        <button class="btn btn-primary" id="backToResultBtn">← Back to Result</button>
                    </div>
                </div>`;
                document.getElementById('backToResultBtn').addEventListener('click', renderResultPage);
            }

            async function loadQuizData() {
                renderLoading();
                try {
                    const response = await fetch(QUIZ_DATA_URL);
                    if (!response.ok) throw new Error(`Failed to load quiz data (HTTP ${response.status})`);
                    const data = await response.json();
                    validateQuizData(data);
                    quizData = data;
                    initQuizState();
                    determineNextScreen();
                } catch (err) {
                    console.error('Quiz load error:', err);
                    renderError('Failed to Load Quiz', err.message || 'Could not load quiz data. Please check the quiz.json file.');
                }
            }

            function validateQuizData(data) {
                if (!data || typeof data !== 'object') throw new Error('Invalid JSON: data must be an object.');
                if (!data.schemaVersion) throw new Error('Missing schemaVersion in quiz.json');
                if (!data.quizId) throw new Error('Missing quizId in quiz.json');
                if (!data.title) throw new Error('Missing title in quiz.json');
                if (!data.duration || typeof data.duration !== 'number') throw new Error('Missing or invalid duration');
                if (!data.startTime) throw new Error('Missing startTime');
                if (!data.endTime) throw new Error('Missing endTime');
                if (!data.questions || !Array.isArray(data.questions)) throw new Error('Missing questions array');
                if (data.questions.length === 0) throw new Error('Questions array is empty');
                data.questions.forEach((q, i) => {
                    if (!q.id) throw new Error(`Question at index ${i} missing id`);
                    if (!q.question) throw new Error(`Question ${q.id} missing question text`);
                    if (!q.options || !Array.isArray(q.options) || q.options.length !== 4) throw new Error(`Question ${q.id} must have exactly 4 options`);
                    if (typeof q.correct !== 'number' || q.correct < 0 || q.correct > 3) throw new Error(`Question ${q.id} has invalid correct answer index`);
                });
            }

            function checkQuizAvailability() {
                const now = Date.now();
                const startTime = new Date(quizData.startTime).getTime();
                const endTime = new Date(quizData.endTime).getTime();
                if (now < startTime) return { available: false, message: `Quiz has not started yet. It starts at ${formatDateTime(quizData.startTime)}.` };
                if (now > endTime) return { available: false, message: `Quiz has ended. It ended at ${formatDateTime(quizData.endTime)}.` };
                return { available: true, message: '' };
            }

            function determineNextScreen() {
                const availability = checkQuizAvailability();
                if (!availability.available) {
                    appContainer.innerHTML = `<div class="card text-center"><h2>${escapeHtml(quizData.title)}</h2><div class="alert alert-warning">${escapeHtml(availability.message)}</div><p>Please contact the placement coordinator for more information.</p></div>`;
                    return;
                }
                if (quizCompleted && savedResult) { renderResultPage(); return; }
                if (timerEnd && Date.now() >= timerEnd && !quizCompleted) { autoSubmit(); return; }
                if (!studentDetails) { renderStudentForm(); return; }
                if (timerStart && timerEnd && Date.now() < timerEnd) {
                    startTimerInterval();
                    currentQuestionIndex = loadCurrentIndex();
                    visitedQuestions = loadVisited();
                    renderQuizPage();
                    return;
                }
                renderInstructions();
            }

            window.addEventListener('beforeunload', () => {
                if (currentQuizId && !quizCompleted && timerEnd && Date.now() < timerEnd) {
                    saveAnswers(); saveVisited(); saveCurrentIndex(); saveTimerInfo();
                    safeSetItem(KEYS.getTabSwitchesKey(currentQuizId), tabSwitchCount);
                }
            });

            loadQuizData();
            console.log('Quiz Platform ready');
        })();
    </script>
</body>
</html>
